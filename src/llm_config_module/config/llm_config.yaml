llm:
  # Vault Configuration
  vault:
    url: "${VAULT_ADDR:http://vault:8200}"
    token: "${VAULT_TOKEN}"
    enabled: true
  
  # Default provider to use when none is specified
  default_provider: "aws_bedrock"
  
  # Provider configurations
  providers:
    # Azure OpenAI Configuration
    azure_openai:
      # enabled: false
      model: "gpt-4o-mini"
      api_version: "2024-02-15-preview"
      max_tokens: 4096
      temperature: 0.7
      cache: true
      num_retries: 3
      model_type: "chat"

    # AWS Bedrock Configuration
    aws_bedrock:
      # enabled: true # Enable AWS Bedrock for testing
      model: "eu.anthropic.claude-3-haiku-20240307-v1:0"
      max_tokens: 4096
      temperature: 0.7
      cache: true  # Keep caching enabled (DSPY default)
      num_retries: 3
      # Generation parameters
      max_tokens: 4096
      temperature: 0.7
{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.release_name }}"
spec:
  type: {{ .Values.service.type }}
  selector:
    app: "{{ .Values.release_name }}"
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
{{- end }}
replicas: 1
enabled: true
release_name: "data-mapper"

images:
  scope:
    registry: "ghcr.io"
    repository: "buerokratt/datamapper"
    tag: "v2.2.9"

service:
  type: ClusterIP
  port: 3001
  targetPort: 3000

env:
  # DataMapper specific configuration
  PORT: "3000"
  CONTENT_FOLDER: "/data"

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"


pullPolicy: IfNotPresent

podAnnotations: 
  dsl-checksum: "initial"   